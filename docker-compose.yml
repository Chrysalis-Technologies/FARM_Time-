services:
  db:
    image: postgres:${POSTGRES_IMAGE_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - farmos_internal

  www:
    image: farmos/farmos:${FARMOS_IMAGE_TAG}
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/sites:/opt/drupal/web/sites
      - ./data/keys:/opt/drupal/keys
    healthcheck:
      test: ["CMD-SHELL", "apache2ctl -t"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - farmos_internal

  proxy:
    image: caddy:${CADDY_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      www:
        condition: service_started
    environment:
      SITE_HOSTNAME: ${SITE_HOSTNAME}
      SITE_EMAIL: ${SITE_EMAIL}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/proxy/data:/data
      - ./data/proxy/config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - farmos_internal

networks:
  farmos_internal:
    driver: bridge
